services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATA_MODE: ${DATA_MODE:-sample}
      DEBUG: ${DEBUG:-false}
      PORT: ${PORT:-8000}
      AZURE_MAPS_KEY: ${AZURE_MAPS_KEY:-}
      AZURE_MAPS_CLIENT_ID: ${AZURE_MAPS_CLIENT_ID:-}
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-}
      AZURE_STORAGE_CONTAINER_RAW: ${AZURE_STORAGE_CONTAINER_RAW:-raw-data}
      AZURE_STORAGE_CONTAINER_PROCESSED: ${AZURE_STORAGE_CONTAINER_PROCESSED:-processed-data}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_ACCOUNT_URL: ${AZURE_STORAGE_ACCOUNT_URL:-}
      COSMOS_ENDPOINT: ${COSMOS_ENDPOINT:-}
      COSMOS_KEY: ${COSMOS_KEY:-}
      COSMOS_DATABASE: ${COSMOS_DATABASE:-mobilitydb}
      COSMOS_ROUTES_CONTAINER: ${COSMOS_ROUTES_CONTAINER:-routes}
      COSMOS_DISTRICTS_CONTAINER: ${COSMOS_DISTRICTS_CONTAINER:-districts}
      COSMOS_EVENTS_CONTAINER: ${COSMOS_EVENTS_CONTAINER:-events}
      EVENT_HUB_CONNECTION_STRING: ${EVENT_HUB_CONNECTION_STRING:-}
      EVENT_HUB_NAME: ${EVENT_HUB_NAME:-mobility-events}
      ENABLE_LIVE_EVENTS: ${ENABLE_LIVE_EVENTS:-true}
